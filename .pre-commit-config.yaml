repos:
  # Secret scanning — blocks leaks before they hit the remote
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Python linting + formatting (Astral)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Kept in sync with the ruff version uv.lock actually resolves (see
    # `just ci-lint`'s `uv run ruff check .`) -- the previous v0.6.9 pin was
    # a full year stale and flagged findings (e.g. S603 on subprocess.run
    # calls already justified with a # noqa-equivalent comment) that the
    # project's real, tested ruff version does not.
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Type checking — local hook, not mirrors-mypy: that hook's isolated venv
  # (additional_dependencies: []) has none of this project's dependencies
  # installed, so anything touching coincurve (nostr.py, mint_auth_tag.py,
  # selftest.py) degrades to `Any` and false-positives on
  # --warn-return-any-style checks, and anything in tests/ using a pytest
  # decorator like @pytest.mark.xfail reads as "untyped decorator" — both
  # cascade into spurious errors mypy in this project's own venv does not
  # produce. Shelling into the project's own uv-managed venv is both correct
  # and guarantees this can never again disagree with `just ci-lint`'s own
  # `uv run mypy src/` (same pattern already used for import-linter/opengrep
  # below, and for aither's equivalent hook).
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src/
        language: system
        types: [python]
        pass_filenames: false

  # Shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker

  # Conventional commits
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Dependency vulnerability scan (runs on push, not commit — slow)
  - repo: https://github.com/google/osv-scanner
    rev: v1.9.1
    hooks:
      - id: osv-scanner
        stages: [pre-push]

  # Architecture boundary enforcement (slot — fill .importlinter)
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (architecture boundaries)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false

  # Custom semantic rules (opengrep — self-weakening guard + project rules)
  - repo: local
    hooks:
      - id: opengrep
        name: opengrep (self-weakening + project rules)
        # Requires opengrep in PATH — installed by .devcontainer/post-create.sh
        entry: bash -c 'command -v opengrep >/dev/null 2>&1 || { echo "opengrep required — run .devcontainer/post-create.sh"; exit 1; }; opengrep scan --config .opengrep/rules/ . --error --severity ERROR'
        language: system
        pass_filenames: false
        stages: [pre-commit]
