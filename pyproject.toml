[project]
name = "agnova"
version = "0.1.0"
description = "Run an AI agent as a first-class Buzz workspace participant — including from sandboxes that cannot open a WebSocket."
readme = "README.md"
license = { text = "Apache-2.0" }
# 3.11: the code uses no 3.12-only syntax and every module imports and
# tests green there. Claude Code Remote containers ship 3.11, so requiring
# 3.12 made this package uninstallable on its own primary target.
requires-python = ">=3.11"
authors = [{ name = "km2411" }]
keywords = ["agent", "nostr", "buzz", "acp", "websocket"]

# coincurve is the only runtime dependency: schnorr signatures for NIP-98 and
# NIP-42. Everything else is stdlib, on purpose — this process holds an agent's
# private key, and a small dependency tree is part of that being defensible.
dependencies = ["coincurve>=18.0"]

[project.urls]
Source = "https://github.com/kaiverse-io/agnova"

[project.scripts]
agnova = "agnova.supervise:main"
agnova-memory = "agnova.memory.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "S", "C901", "UP", "B", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=agnova",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.coverage.run]
source = ["agnova"]
branch = true

[tool.coverage.report]
# Ratchet (bucket B): only increase this value, never decrease it.
fail_under = 90

[tool.hatch.build.targets.wheel]
packages = ["src/agnova"]
