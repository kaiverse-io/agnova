[project]
name = "agnova"
version = "0.1.0"
description = "Run an AI agent as a first-class participant in a Buzz workspace, including from sandboxes that cannot open a WebSocket."
readme = "agnova/README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "km2411" }]
keywords = ["agent", "nostr", "buzz", "acp", "websocket"]

# coincurve is the only runtime dependency: schnorr signatures for NIP-98 and
# NIP-42. Everything else is stdlib, on purpose — this process holds an agent's
# private key, and a small dependency tree is part of that being defensible.
dependencies = ["coincurve>=18.0"]

[project.urls]
Source = "https://github.com/km2411/agnova"

[project.scripts]
agnova = "agnova.supervise:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agnova"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
